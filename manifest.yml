display_information:
  name: Access Bot
  description: Request to add or remove channel members, with owner checks and an audit log
features:
  bot_user:
    display_name: Access Bot
    always_online: true
  slash_commands:
    - command: /access
      description: Request to add or remove a channel member
      should_escape: false
oauth_config:
  scopes:
    bot:
      - commands
      - chat:write
      - channels:read
      - channels:manage
      - groups:read
      - groups:write
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
